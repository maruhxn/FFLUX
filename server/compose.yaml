# 로컬 개발용 MySQL. `./gradlew :app:bootRun`이 spring-boot-docker-compose로 자동 기동한다.
services:
  mysql:
    image: mysql:8.4
    command: --default-time-zone=+09:00
    environment:
      MYSQL_DATABASE: fflux
      MYSQL_USER: fflux
      MYSQL_PASSWORD: fflux-local
      MYSQL_ROOT_PASSWORD: fflux-local-root
      TZ: Asia/Seoul
    ports:
      - "3306"
