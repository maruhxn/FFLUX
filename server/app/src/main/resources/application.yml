spring:
  application:
    name: fflux
  config:
    # 로컬 bootRun(작업 디렉터리 server/app)에서 server/.env 값을 읽는다. 운영에서는 환경변수를 쓴다.
    import: optional:file:../.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  session:
    jdbc:
      # 세션 테이블은 Flyway 마이그레이션(V1)이 만든다.
      initialize-schema: never
  docker:
    compose:
      # 로컬 개발(bootRun)에서만 server/compose.yaml의 MySQL을 띄운다.
      file: ../compose.yaml

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # 운영(HTTPS)에서는 true로 둔다.
        secure: ${SESSION_COOKIE_SECURE:false}

fflux:
  test-accounts:
    enabled: ${TEST_ACCOUNTS_ENABLED:true}
    streamer-password: ${TEST_STREAMER_PASSWORD:}
    viewer-password: ${TEST_VIEWER_PASSWORD:}
  cors:
    # API를 부르는 다른 출처의 프론트(쉼표로 여러 개). 비어 있으면 같은 출처만 받는다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  mediamtx:
    # MediaMTX Control API(송출 세션 kick). 로컬은 infra compose가 127.0.0.1:9997에 연다.
    api-url: ${MEDIAMTX_API_URL:http://localhost:9997}
  toss:
    # 토스페이먼츠 API 개별 연동 시크릿 키(테스트 키는 test_sk_로 시작). 비어 있으면 결제 승인이 거절된다.
    secret-key: ${TOSS_SECRET_KEY:}
