# FFLUX 로컬 개발 스택: Caddy + MediaMTX. Spring은 호스트에서 bootRun으로 띄운다.
# 실행: 저장소 루트에서 `docker compose -f infra/compose.yml --env-file .env up -d` (infra/README.md 참고)
name: fflux-local

services:
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    environment:
      # PC 내부 IP(쉼표로 여러 개). 비어 있으면 mediamtx.yml 값([])을 쓴다.
      MTX_WEBRTCADDITIONALHOSTS: ${WEBRTC_ADDITIONAL_HOSTS:-}
      # MediaMTX가 인증 콜백과 훅으로 부를 Spring 주소. 로컬은 호스트의 bootRun(8080).
      FFLUX_SERVER_URL: ${FFLUX_SERVER_URL:-http://host.docker.internal:8080}
      MTX_AUTHHTTPADDRESS: ${FFLUX_SERVER_URL:-http://host.docker.internal:8080}/internal/mediamtx/auth
    extra_hosts:
      # Linux Docker에서도 host.docker.internal이 호스트를 가리키게 한다(Docker Desktop은 기본 제공).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./hooks:/hooks:ro
      - ./data/recordings:/recordings
      - ./data/vod:/vod
    ports:
      # WebRTC 미디어. WHIP/WHEP/HLS의 HTTP 포트(8889/8888)는 Caddy를 통해서만 연다.
      - "8189:8189/udp"
      - "8189:8189/tcp"
      # Control API. 호스트의 bootRun(Spring)만 쓰도록 127.0.0.1에만 연다.
      - "127.0.0.1:9997:9997"

  # 남은 녹화 원본을 1분마다 다시 처리한다(hooks/sweep-recordings.sh). MediaMTX와 같은 이미지라 ffmpeg가 있다.
  recording-sweeper:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    # sh가 1번 프로세스면 종료 신호를 받지 못해 멈출 때 기다리게 된다.
    init: true
    entrypoint: ["sh", "/hooks/sweep-recordings.sh"]
    environment:
      FFLUX_SERVER_URL: ${FFLUX_SERVER_URL:-http://host.docker.internal:8080}
      MEDIAMTX_API_URL: http://mediamtx:9997
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./hooks:/hooks:ro
      - ./data/recordings:/recordings
      - ./data/vod:/vod

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - mediamtx
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./spike:/srv/spike:ro
      - ./data/vod:/srv/vod:ro
      - caddy_data:/data

volumes:
  caddy_data:
