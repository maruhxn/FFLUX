<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC 송출 - FFLUX 스파이크</title>
  <link rel="stylesheet" href="spike.css">
</head>
<body>
  <nav><a href="./">처음</a><a href="watch.html">시청</a><a href="recordings.html">녹화</a></nav>
  <h1>PC 송출 (화면 공유 + 소리 믹싱)</h1>
  <label>path <input id="path" type="text" value="rec/pc1"></label>
  <label><input id="useMic" type="checkbox" checked> 마이크 섞기</label>
  <p class="hint">공유 창에서 "탭 오디오 공유"(macOS) 또는 "시스템 오디오 공유"(Windows)를 켜야 화면 소리가 들어갑니다. 소리가 없으면 마이크만 보냅니다.</p>
  <button id="start">송출 시작</button>
  <button id="stop" disabled>송출 종료</button>
  <p class="status" id="status">대기</p>
  <p>시청 링크: <a id="viewer" target="_blank"></a></p>
  <video id="preview" autoplay muted playsinline></video>
  <h2>협상된 코덱 (getStats, outbound-rtp)</h2>
  <pre id="codecs">-</pre>
  <h2>로그</h2>
  <pre id="log"></pre>
  <script src="spike.js"></script>
  <script>
    let session, display, mic, audioCtx, stopStats;

    $("path").addEventListener("input", updateLink);
    updateLink();
    function updateLink() {
      $("viewer").href = $("viewer").textContent = viewerLink($("path").value);
    }

    // 화면 공유 소리와 마이크를 Web Audio로 섞어 오디오 트랙 하나로 만든다.
    function mixAudio(sources) {
      audioCtx = new AudioContext();
      const dest = audioCtx.createMediaStreamDestination();
      for (const track of sources) {
        audioCtx.createMediaStreamSource(new MediaStream([track])).connect(dest);
      }
      return dest.stream.getAudioTracks()[0];
    }

    $("start").onclick = async () => {
      $("start").disabled = true;
      try {
        display = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 30 },
          audio: true,
          systemAudio: "include",
        });
        if ($("useMic").checked) {
          try {
            mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
          } catch (e) {
            log(`마이크 사용 불가(화면 소리만 송출): ${e.message}`);
          }
        }
        const audioSources = [...display.getAudioTracks(), ...(mic ? mic.getAudioTracks() : [])];
        const labels = [];
        if (display.getAudioTracks().length) labels.push("화면 소리");
        if (mic) labels.push("마이크");
        log(`오디오 소스: ${labels.length ? labels.join(" + ") : "없음(영상만)"}`);

        const tracks = [display.getVideoTracks()[0]];
        if (audioSources.length) tracks.push(mixAudio(audioSources));
        const stream = new MediaStream(tracks);
        $("preview").srcObject = new MediaStream([display.getVideoTracks()[0]]);

        // 사용자가 브라우저의 "공유 중지"를 누르면 송출도 끝낸다.
        display.getVideoTracks()[0].addEventListener("ended", stop);

        session = await whipPublish($("path").value, stream);
        stopStats = watchCodecs(session.pc, "outbound-rtp", $("codecs"));
        $("status").textContent = `송출 중: ${$("path").value} (오디오: ${labels.join(" + ") || "없음"})`;
        $("stop").disabled = false;
      } catch (e) {
        log(`송출 실패: ${e.message}`);
        await stop();
      }
    };

    $("stop").onclick = stop;

    async function stop() {
      stopStats?.();
      await closeSession(session);
      session = null;
      for (const s of [display, mic]) s?.getTracks().forEach((t) => t.stop());
      display = mic = null;
      await audioCtx?.close();
      audioCtx = null;
      $("preview").srcObject = null;
      $("status").textContent = "대기";
      $("start").disabled = false;
      $("stop").disabled = true;
    }
  </script>
</body>
</html>
