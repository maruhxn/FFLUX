# CI: main 푸시와 PR에서 서버·클라이언트를 검사한다. 배포는 이 workflow가 main에서 성공하면 cd.yml이 이어서 한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # 통합 테스트는 Testcontainers로 MySQL을 띄운다(러너에 Docker가 있다).
      - run: ./gradlew test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc -b(타입체크) 후 vite build
      - run: npm run build
