# CI: main 푸시와 PR에서 서버·클라이언트를 검사한다.
# CD: main 푸시에서 검사가 통과하고 서버·인프라가 바뀌었으면 Spring 이미지를 GHCR에 올리고 VM(api.fflux.kro.kr)에 배포한다.
# 프론트(fflux.kro.kr)는 Vercel이 GitHub 연동으로 따로 배포한다.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # 통합 테스트는 Testcontainers로 MySQL을 띄운다(러너에 Docker가 있다).
      - run: ./gradlew test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc -b(타입체크) 후 vite build
      - run: npm run build

  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            deploy:
              - 'server/**'
              - 'compose.yml'
              - 'infra/**'
              - '.github/workflows/ci.yml'

  deploy:
    needs: [server, client, changes]
    if: github.event_name == 'push' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # 배포는 겹치지 않게 하나씩. 진행 중인 배포는 취소하지 않는다.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/maruhxn/fflux-app
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: server
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # 장기 키 없이 Workload Identity Federation으로 배포용 서비스 계정을 빌린다. VM은 IAP 터널로만 접속한다.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      # VM 저장소를 이 run의 커밋에 맞춰(compose·infra와 앱 이미지가 같은 커밋) 그 커밋의 이미지로 다시 띄운다.
      - name: VM에 배포
        run: |
          gcloud compute ssh fflux --project=fflux-maruhxn --zone=asia-northeast3-a --tunnel-through-iap --quiet \
            --command="cd /opt/fflux && sudo git fetch -q origin && sudo git checkout -q --detach ${{ github.sha }} && sudo APP_TAG=${{ github.sha }} sh -c 'docker compose pull app && docker compose up -d' && sudo docker image prune -f"

      - name: 배포 확인
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 -o /dev/null 'https://api.fflux.kro.kr/api/broadcasts?status=LIVE'; then echo "API 정상"; exit 0; fi
            sleep 10
          done
          echo "배포 후 5분 안에 API가 응답하지 않았다"; exit 1
